<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--standalone:start-->
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<!--standalone:end-->
<title>Violet's Sparkle Palace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen app. Home = title + big picture tiles. Each app = stage (the art) + picture controls. Single bright pastel look, by choice. */
:root{
  --sky:#fbefff;
  --plum:#4f2470;
  --plum-soft:#8a6aa3;
  --pink:#ff4fa3;
  --pink-soft:#ffd3ea;
  --gold:#ffcc3d;
  --card:#ffffff;
  --ring:#ff4fa3;
  --shadow:0 8px 22px rgba(120,50,160,.20);
  --display:'Fredoka', ui-rounded, 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{
  height:100%;margin:0;overflow:hidden;
  font-family:var(--display);color:var(--plum);
  background:
    radial-gradient(circle at 15% 10%, #ffdcef 0, transparent 42%),
    radial-gradient(circle at 90% 25%, #dcf0ff 0, transparent 45%),
    radial-gradient(circle at 50% 100%, #fff0c8 0, transparent 55%),
    var(--sky);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--plum);outline-offset:3px}
svg{display:block}
.view{height:100%;width:100%}
[hidden]{display:none!important}

/* corner buttons */
.corner{
  position:fixed;z-index:20;width:56px;height:56px;border-radius:50%;
  background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;
  top:calc(env(safe-area-inset-top,0px) + 12px);
}
.corner svg{width:32px;height:32px}
#homeBtn{left:max(14px, env(safe-area-inset-left,0px))}
#muteBtn{right:max(14px, env(safe-area-inset-right,0px))}
.corner:active{transform:scale(.92)}

/* ---------- home ---------- */
#home{
  display:grid;place-items:center;overflow-y:auto;
  padding-block:84px 24px;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
.home-inner{width:min(100%, 900px);display:grid;gap:clamp(18px,4vh,36px);justify-items:center}
.logo{margin:0;text-align:center;line-height:1;font-weight:700;font-size:clamp(2.1rem, 8.5vw, 4.2rem);text-wrap:balance;letter-spacing:.01em}
.logo small{display:block;font-size:.5em;font-weight:600;color:var(--plum-soft);letter-spacing:.04em;margin-bottom:.15em}
.logo .shine{
  background:linear-gradient(90deg,#ff5fa8,#ff9f5a,#f5c400,#4cc98a,#41a8f0,#9a6bff,#ff5fa8);
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 6s linear infinite;
}
@keyframes shine{to{background-position:200% 0}}
.tiles{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:clamp(12px,3vw,28px);width:100%}
@media (max-width:640px) and (orientation:portrait){ .tiles{grid-template-columns:minmax(0,1fr);max-width:340px} }
.tile{
  position:relative;display:grid;gap:8px;justify-items:center;
  background:var(--card);border-radius:34px;padding:14px 14px 16px;box-shadow:var(--shadow);
  border:5px solid #fff;transition:transform .15s;
}
.tile .art{width:100%;aspect-ratio:4/3;border-radius:24px;overflow:hidden}
.tile .art svg{width:100%;height:100%}
.tile .name{font-size:clamp(1.05rem,3.6vw,1.35rem);font-weight:600}
.tile:active{transform:scale(.96)}
.tile.t1{border-color:#ffc2e0}.tile.t2{border-color:#cfe4ff}.tile.t3{border-color:#c9f2e6}
@media (max-width:640px) and (orientation:portrait){
  .tile{grid-template-columns:120px minmax(0,1fr);align-items:center;text-align:left;justify-items:start;padding:10px 14px 10px 10px}
  .tile .art{aspect-ratio:1}
  .tile .name{font-size:1.3rem}
}
.soon-badge{
  position:absolute;top:-10px;right:-6px;background:#6b4bc4;color:#fff;border-radius:999px;
  padding:5px 12px 6px;font-size:.85rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;box-shadow:var(--shadow);
}
.tile.soon .art{filter:saturate(.55) brightness(1.04)}
.wiggle{animation:wiggle .5s ease}
@keyframes wiggle{20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}

/* ---------- dress-up ---------- */
#dressup{
  display:grid;grid-template-rows:minmax(0,1fr) auto;
  padding-block:12px 10px;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  gap:10px;
}
.stage{min-height:0;container-type:size;display:grid;place-items:center}
.frame{
  position:relative;width:min(100cqw, 75cqh);height:min(100cqh, 133.333cqw);
  border-radius:30px;overflow:hidden;background:#fff;box-shadow:var(--shadow), 0 0 0 6px #fff;
}
.frame > .pic, .frame > .pic svg{width:100%;height:100%}
.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.035)}}
.spin{animation:spin .6s ease}
@keyframes spin{30%{transform:scale(.94) rotate(-3deg)}60%{transform:scale(1.04) rotate(3deg)}}
.actions{position:absolute;right:10px;bottom:10px;display:grid;gap:10px}
.act{
  width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:var(--shadow);
  display:grid;place-items:center;
}
.act svg{width:34px;height:34px}
.act:active{transform:scale(.9)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .5s ease}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}

.controls{display:grid;gap:10px;min-width:0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.7);
  display:grid;place-items:center;transition:transform .15s, background .15s;
}
.tab svg{width:38px;height:38px}
.tab[aria-selected="true"]{background:#fff;box-shadow:var(--shadow), inset 0 0 0 4px var(--ring);transform:translateY(-2px)}
.items{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.items::-webkit-scrollbar{display:none}
.item{
  flex:0 0 auto;width:86px;height:86px;border-radius:22px;overflow:hidden;background:#fff;
  box-shadow:0 4px 12px rgba(120,50,160,.16);border:4px solid #fff;transition:transform .15s;
}
.item svg{width:100%;height:100%}
.item.on{border-color:var(--ring);transform:translateY(-3px) scale(1.03)}
.item:active{transform:scale(.93)}
.colors{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding-bottom:2px}
.dot{width:46px;height:46px;border-radius:50%;box-shadow:0 3px 8px rgba(120,50,160,.22), inset 0 0 0 4px #fff}
.dot.on{box-shadow:0 0 0 4px var(--ring), inset 0 0 0 4px #fff;transform:scale(1.08)}
.dot:active{transform:scale(.9)}

@media (orientation:landscape) and (min-width:700px){
  #dressup{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) minmax(300px, 46%);padding-top:12px;align-items:center}
  .stage{height:100%}
  .controls{align-content:center;padding-top:60px}
  .tabs{flex-wrap:wrap;overflow:visible;justify-content:center}
  .items{flex-wrap:wrap;overflow:visible;justify-content:center}
  .item{width:96px;height:96px}
}
@media (orientation:portrait) and (max-height:640px){
  .item{width:72px;height:72px;border-radius:18px}
  .tab{width:50px;height:50px}
  .dot{width:40px;height:40px}
}

/* gallery sheet */
.sheet{
  position:fixed;inset:0;z-index:30;background:rgba(79,36,112,.35);display:grid;place-items:end center;
  padding-left:max(12px, env(safe-area-inset-left,0px));padding-right:max(12px, env(safe-area-inset-right,0px));
}
.sheet-card{
  width:min(100%, 720px);max-height:78%;overflow-y:auto;background:#fff8fd;border-radius:32px 32px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);
}
.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-top .title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:1.2rem}
.sheet-top .title svg{width:34px;height:34px}
.close{width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center}
.close svg{width:26px;height:26px}
.gal{display:grid;grid-template-columns:repeat(auto-fill, minmax(96px,1fr));gap:12px}
.gal button{aspect-ratio:3/4;border-radius:20px;overflow:hidden;box-shadow:0 4px 12px rgba(120,50,160,.18);border:4px solid #fff}
.gal button svg{width:100%;height:100%}
.empty{display:grid;justify-items:center;gap:6px;padding:20px 0 10px;color:var(--plum-soft);font-size:1.05rem}
.empty svg{width:90px;height:90px}

/* ---------- sparkle wand ---------- */
#wand{position:relative;overflow:hidden;border-radius:0}
#wandCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.wandbar{
  position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));pointer-events:none;
}
.wandbar button{pointer-events:auto;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .15s}
.wandbar button svg{width:36px;height:36px}
.wandbar button.on{box-shadow:0 0 0 4px var(--ring), var(--shadow);transform:translateY(-4px)}
.wandbar button:active{transform:scale(.9)}
.wandbar .sep{width:6px}
.hint{position:absolute;left:50%;top:42%;width:120px;height:120px;margin:-60px 0 0 -60px;pointer-events:none;animation:hint 2.4s ease-in-out infinite}
@keyframes hint{0%{transform:translate(-50px,30px) rotate(-10deg)}50%{transform:translate(50px,-20px) rotate(10deg)}100%{transform:translate(-50px,30px) rotate(-10deg)}}

/* ---------- mermaid castle ---------- */
#castle{
  display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px;padding-block:12px 10px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
}
.scene-bg, .scene-bg svg{position:absolute;inset:0;width:100%;height:100%}
#stickers{z-index:1}
#scene .actions{z-index:2}
.stk{position:absolute;transform:translate(-50%,-50%);touch-action:none;cursor:grab}
.stk svg{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 3px rgba(60,30,90,.25))}
.stk.lift svg{transform:scale(1.12);filter:drop-shadow(0 8px 8px rgba(60,30,90,.3))}
.stk.wig svg{animation:wiggle .5s ease}
.stk.drop svg{animation:dropin .35s ease}
@keyframes dropin{0%{transform:scale(1.25)}60%{transform:scale(.92)}100%{transform:scale(1)}}
.tray{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none;touch-action:pan-x}
.tray::-webkit-scrollbar{display:none}
.tray button{flex:0 0 auto;width:80px;height:80px;border-radius:22px;background:#fff;box-shadow:0 4px 12px rgba(120,50,160,.16);display:grid;place-items:center;touch-action:pan-x;border:4px solid #fff}
.tray button svg{max-width:62px;max-height:64px;width:auto;height:auto}
.tray button.t-tall svg{height:66px;width:auto}
.tray button:active{transform:scale(.93)}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);filter:drop-shadow(0 10px 10px rgba(60,30,90,.3))}
.ghost svg{width:100%;height:auto;display:block}
@media (orientation:landscape) and (min-width:700px){
  #castle{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) minmax(280px, 40%);align-items:center}
  .tray{flex-wrap:wrap;overflow:visible;justify-content:center;touch-action:auto;padding-top:64px}
  .tray button{touch-action:none}
}

/* twinkles inside art */
.tw{animation:tw 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{transform:scale(.55);opacity:.55}50%{transform:scale(1);opacity:1}}
.flyheart{position:fixed;z-index:40;width:60px;height:60px;pointer-events:none;transition:transform .7s cubic-bezier(.5,-0.3,.6,1), opacity .7s}

@media (prefers-reduced-motion: reduce){
  .tw,.logo .shine,.pop,.spin,.wiggle,.flash.go,.hint,.stk.wig svg,.stk.drop svg{animation:none!important}
  .flyheart{transition:none}
}
</style>
</head>
<body>

<button class="corner" id="homeBtn" aria-label="Home" hidden>
  <svg viewBox="0 0 40 40"><path d="M6 19 L20 7 L34 19 V33 a3 3 0 0 1 -3 3 H9 a3 3 0 0 1 -3 -3Z" fill="#ffb3d6" stroke="#ff4fa3" stroke-width="2.5" stroke-linejoin="round"/><path d="M16 36 V26 a4 4 0 0 1 8 0 V36" fill="#fff" stroke="#ff4fa3" stroke-width="2.5"/><path d="M14 6 L16 2 L18 6 L20 1 L22 6 L24 2 L26 6Z" fill="#ffcc3d"/></svg>
</button>
<button class="corner" id="muteBtn" aria-label="Sound on or off"></button>

<!-- HOME -->
<section class="view" id="home">
  <div class="home-inner">
    <h1 class="logo"><small>Violet's</small><span class="shine">Sparkle Palace</span></h1>
    <div class="tiles">
      <button class="tile t1" data-go="dress-up" aria-label="Royal Dress-Up">
        <div class="art" id="tileDress"></div>
        <span class="name">Royal Dress-Up</span>
      </button>
      <button class="tile t2" data-go="wand" aria-label="Sparkle Wand">
        <div class="art">
          <svg viewBox="0 0 160 120">
            <rect width="160" height="120" fill="#2f2668"/>
            <g fill="#fff" opacity=".8"><circle cx="20" cy="18" r="1.6"/><circle cx="140" cy="22" r="1.4"/><circle cx="120" cy="100" r="1.5"/><circle cx="34" cy="96" r="1.2"/><circle cx="80" cy="12" r="1.2"/></g>
            <g fill="none" stroke-linecap="round" stroke-width="7">
              <path d="M18 104 C40 70 60 96 80 66 S110 40 116 34" stroke="#ff8ac2"/>
              <path d="M22 110 C44 78 64 104 84 74 S112 48 118 40" stroke="#ffd36a" opacity=".9"/>
              <path d="M14 98 C36 62 56 88 76 58 S108 32 114 28" stroke="#8fd8ff" opacity=".9"/>
            </g>
            <line x1="96" y1="96" x2="122" y2="34" stroke="#ffd34d" stroke-width="6" stroke-linecap="round"/>
            <path d="M124 10 L129 23 L143 23 L132 31 L136 45 L124 37 L112 45 L116 31 L105 23 L119 23Z" fill="#ffe27a" stroke="#f0a92a" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M44 40 c-6 -6 -14 2 -6 9 l6 5 l6 -5 c8 -7 0 -15 -6 -9z" fill="#ff7fb8"/>
            <path d="M66 22 Q66 28 72 28 Q66 28 66 34 Q66 28 60 28 Q66 28 66 22Z" fill="#fff6b0"/>
            <path d="M140 72 Q140 77 145 77 Q140 77 140 82 Q140 77 135 77 Q140 77 140 72Z" fill="#fff6b0"/>
          </svg>
        </div>
        <span class="name">Sparkle Wand</span>
        <span class="soon-badge" data-soon>Soon</span>
      </button>
      <button class="tile t3" data-go="castle" aria-label="Mermaid Castle">
        <div class="art">
          <svg viewBox="0 0 160 120">
            <defs><linearGradient id="tcs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd8ef"/><stop offset="1" stop-color="#bfefff"/></linearGradient>
            <linearGradient id="tcw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd6f0"/><stop offset="1" stop-color="#3f8fd8"/></linearGradient></defs>
            <rect width="160" height="120" fill="url(#tcs)"/>
            <g fill="none" stroke-width="6" opacity=".85"><path d="M10 86 A70 70 0 0 1 150 86" stroke="#ff9a9a"/><path d="M18 86 A62 62 0 0 1 142 86" stroke="#ffd27a"/><path d="M26 86 A54 54 0 0 1 134 86" stroke="#a6e8a0"/><path d="M34 86 A46 46 0 0 1 126 86" stroke="#94d3ff"/><path d="M42 86 A38 38 0 0 1 118 86" stroke="#c7a8ff"/></g>
            <rect x="50" y="52" width="60" height="44" fill="#e8d8ff"/>
            <rect x="38" y="40" width="20" height="56" fill="#dcc8ff"/><rect x="102" y="40" width="20" height="56" fill="#dcc8ff"/>
            <path d="M35 42 L48 16 L61 42Z" fill="#ff9fcf"/><path d="M99 42 L112 16 L125 42Z" fill="#ff9fcf"/>
            <rect x="70" y="34" width="20" height="30" fill="#d3bcff"/><path d="M67 36 L80 10 L93 36Z" fill="#ff7fbf"/>
            <path d="M74 96 V80 a6 6 0 0 1 12 0 V96Z" fill="#b79cf0"/>
            <path d="M0 92 Q20 84 40 92 T80 92 T120 92 T160 92 V120 H0Z" fill="url(#tcw)"/>
            <g fill="#fff" opacity=".7"><circle cx="30" cy="104" r="3"/><circle cx="36" cy="112" r="2"/><circle cx="126" cy="106" r="2.5"/></g>
            <path d="M104 106 c6 -8 14 -8 18 0 c-4 6 -12 6 -18 0z M122 106 l8 -5 v10z" fill="#ff9f7a"/>
          </svg>
        </div>
        <span class="name">Mermaid Castle</span>
        <span class="soon-badge" data-soon>Soon</span>
      </button>
    </div>
  </div>
</section>

<!-- ROYAL DRESS-UP -->
<section class="view" id="dressup" hidden>
  <div class="stage">
    <div class="frame" id="frame">
      <div class="pic" id="pic"></div>
      <div class="flash" id="flash"></div>
      <div class="actions">
        <button class="act" id="surpriseBtn" aria-label="Surprise me">
          <svg viewBox="0 0 40 40"><path d="M20 3 L24 15 L37 15 L26.5 22.5 L30.5 35 L20 27.5 L9.5 35 L13.5 22.5 L3 15 L16 15Z" fill="#ffd34d" stroke="#f0a92a" stroke-width="2" stroke-linejoin="round"/><path d="M33 3 Q33 7 37 7 Q33 7 33 11 Q33 7 29 7 Q33 7 33 3Z" fill="#ff7fb8"/><path d="M6 28 Q6 31 9 31 Q6 31 6 34 Q6 31 3 31 Q6 31 6 28Z" fill="#8fd0ff"/></svg>
        </button>
        <button class="act" id="saveBtn" aria-label="Save this look">
          <svg viewBox="0 0 40 40"><path d="M20 34 C8 26 3 19 3 13 C3 7 8 4 12.5 4 C16 4 18.5 6 20 9 C21.5 6 24 4 27.5 4 C32 4 37 7 37 13 C37 19 32 26 20 34Z" fill="#ff6fae" stroke="#e8428c" stroke-width="2"/><path d="M11 11 Q12 8 15 8" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
        </button>
        <button class="act" id="galleryBtn" aria-label="My looks">
          <svg viewBox="0 0 40 40"><rect x="4" y="6" width="32" height="28" rx="6" fill="#fff" stroke="#b48cff" stroke-width="3"/><rect x="9" y="11" width="22" height="18" rx="3" fill="#d9ecff"/><path d="M9 26 L16 18 L21 23 L25 19 L31 26 V29 H9Z" fill="#9be39b"/><circle cx="26" cy="15" r="2.5" fill="#ffd34d"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div class="controls">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="items" id="items"></div>
    <div class="colors" id="colors"></div>
  </div>
</section>

<!-- SPARKLE WAND -->
<section class="view" id="wand" hidden>
  <canvas id="wandCanvas" aria-label="Draw with your finger"></canvas>
  <svg class="hint" id="wandHint" viewBox="0 0 120 120" aria-hidden="true">
    <line x1="40" y1="100" x2="74" y2="42" stroke="#ffd34d" stroke-width="7" stroke-linecap="round"/>
    <path d="M77 14 L83 30 L100 30 L86 40 L91 57 L77 47 L63 57 L68 40 L54 30 L71 30Z" fill="#ffe27a" stroke="#f0a92a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M104 60 Q104 66 110 66 Q104 66 104 72 Q104 66 98 66 Q104 66 104 60Z" fill="#fff"/>
    <path d="M30 40 Q30 45 35 45 Q30 45 30 50 Q30 45 25 45 Q30 45 30 40Z" fill="#fff"/>
  </svg>
  <div class="wandbar" id="wandbar">
    <button data-b="rainbow" aria-label="Rainbow wand" class="on"><svg viewBox="0 0 40 40"><g fill="none" stroke-width="4" stroke-linecap="round"><path d="M5 30A15 15 0 0 1 35 30" stroke="#ff8f8f"/><path d="M10 30A10 10 0 0 1 30 30" stroke="#ffe070"/><path d="M15 30A5 5 0 0 1 25 30" stroke="#7fc8ff"/></g></svg></button>
    <button data-b="gold" aria-label="Star wand"><svg viewBox="0 0 40 40"><path d="M20 4 L24 15 L36 15 L26 22 L30 34 L20 27 L10 34 L14 22 L4 15 L16 15Z" fill="#ffd34d" stroke="#f0a92a" stroke-width="2" stroke-linejoin="round"/></svg></button>
    <button data-b="hearts" aria-label="Heart wand"><svg viewBox="0 0 40 40"><path d="M20 34 C8 26 4 19 4 13 C4 7 9 5 13 5 C16 5 18.5 7 20 10 C21.5 7 24 5 27 5 C31 5 36 7 36 13 C36 19 32 26 20 34Z" fill="#ff6fae"/></svg></button>

<script>
(function(){
"use strict";
/* ---------------- storage (optional; page works without it) ---------------- */
const store={
  get(k,d){try{const v=localStorage.getItem('vsp.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('vsp.'+k,JSON.stringify(v))}catch(e){}}
};

/* ---------------- gentle synthesized sounds ---------------- */
const Snd={
  ctx:null,out:null,muted:store.get('muted',false),
  ensure(){
    if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
      this.ctx=new AC();this.out=this.ctx.createGain();this.out.gain.value=.8;this.out.connect(this.ctx.destination);}
    if(this.ctx.state==='suspended')this.ctx.resume();
    return this.ctx;
  },
  note(f,when,dur,vol,type){
    if(this.muted)return;const c=this.ensure();if(!c)return;
    const t=c.currentTime+(when||0),o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(this.out);o.start(t);o.stop(t+dur+.05);
  },
  bell(f,when,vol){vol=vol||.09;this.note(f,when,.9,vol);this.note(f*2,when,.45,vol*.3);this.note(f*3.01,when,.22,vol*.1,'triangle');}
};
const P=[523.3,587.3,659.3,784,880,1046.5,1174.7,1318.5,1568,1760];
const sfx={
  tap(i){Snd.bell(P[(i||0)%8]);},
  color(i){Snd.bell(P[((i||0)+2)%10],0,.08);},
  tab(){Snd.note(659.3,0,.18,.06,'triangle');},
  save(){[0,2,4,5,7].forEach((n,i)=>Snd.bell(P[n],i*.08,.08));},
  surprise(){for(let i=0;i<9;i++)Snd.bell(P[i],i*.045,.06);},
  open(){[2,4,7].forEach((n,i)=>Snd.bell(P[n],i*.09,.08));},
  soon(){Snd.note(392,0,.25,.07,'triangle');Snd.note(330,.14,.3,.07,'triangle');},
  home(){[7,4,2].forEach((n,i)=>Snd.bell(P[n],i*.07,.06));}
};

/* ---------------- drawing helpers ---------------- */
function mix(hex,a){
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const t=a>0?255:0,k=Math.abs(a);
  r=Math.round(r+(t-r)*k);g=Math.round(g+(t-g)*k);b=Math.round(b+(t-b)*k);
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}
function spk(x,y,r){return `M${x} ${y-r}Q${x} ${y} ${x+r} ${y}Q${x} ${y} ${x} ${y+r}Q${x} ${y} ${x-r} ${y}Q${x} ${y} ${x} ${y-r}Z`;}
function star5(x,y,r){let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;d+=(i?'L':'M')+(x+rr*Math.cos(a)).toFixed(1)+' '+(y+rr*Math.sin(a)).toFixed(1);}return d+'Z';}
function heart(x,y,s){return `M${x} ${y+s*.9}C${x-s*1.4} ${y+s*.1} ${x-s*.9} ${y-s*1.1} ${x} ${y-s*.35}C${x+s*.9} ${y-s*1.1} ${x+s*1.4} ${y+s*.1} ${x} ${y+s*.9}Z`;}
function cloud(x,y,s){return `<g fill="#fff"><circle cx="${x-18*s}" cy="${y}" r="${12*s}"/><circle cx="${x}" cy="${y-8*s}" r="${16*s}"/><circle cx="${x+18*s}" cy="${y}" r="${12*s}"/><ellipse cx="${x}" cy="${y+4*s}" rx="${30*s}" ry="${10*s}"/></g>`;}
function rng(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}
const RB=['#ff8f8f','#ffbb6e','#ffe070','#94e08f','#7fc8ff','#b796ff'];
const RBSTOPS=RB.map((c,i)=>`<stop offset="${(i/(RB.length-1)).toFixed(2)}" stop-color="${c}"/>`).join('');
const GOLD='#ffd34d',GOLDD='#e3a51c';

/* ---------------- options ---------------- */
const SKIN=['#fde3d3','#f3c29d','#cf9467','#93603f'];

    });

/* ---------------- character parts ---------------- */
const HAIRBACK={

};

    let s=`<path d="M130 214Q150 222 170 214C196 262 240 326 260 378Q150 398 40 378C60 326 104 262 130 214Z" fill="${f}"/>`;

  tiers(f,l,d){

    return `<path d="M82 318Q150 336 218 318L254 384Q150 400 46 384Z" fill="${f}"/>${sc(50,250,388,f)}`
      +`<path d="M112 262Q150 276 188 262L222 326Q150 342 78 326Z" fill="${l}"/>${sc(82,218,330,l)}`

/* ---------------- render a look ---------------- */
function render(s,p,vb){
  const dc=s.dressColor,hc=s.hairColor,sk=SKIN[s.skin];
  const rbD=dc==='rainbow',rbH=hc==='rainbow';
  const f=rbD?`url(#${p}rbv)`:DRESSC[dc], l=rbD?'#ffe6f3':mix(DRESSC[dc],.45), d=rbD?'#a87fd8':mix(DRESSC[dc],-.2);
  const h=rbH?`url(#${p}rbh)`:HAIRC[hc], hd=rbH?'#8a5fb8':mix(HAIRC[hc],-.25);
  const mer=s.dress==='mermaid';
  let o=`<svg viewBox="${vb||'0 0 300 400'}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" preserveAspectRatio="xMidYMid slice"><defs>`+
    `<linearGradient id="${p}rbv" x1="0" y1="0" x2="0" y2="1">${RBSTOPS}</linearGradient>`+
    `<linearGradient id="${p}rbh" x1="0" y1="0" x2="1" y2="1">${RBSTOPS}</linearGradient></defs>`;
  o+=BG[s.place](p);
  o+=HAIRBACK[s.hair](h,hd);
  o+=DRESS[s.dress](f,l,d);
  // neck + torso
  o+=`<rect x="143" y="140" width="14" height="26" rx="4" fill="${sk}"/>`;
  if(mer){
    o+=`<path d="M121 166Q150 156 179 166L171 220Q150 226 129 220Z" fill="${sk}"/>`;
    o+=`<path d="M128 186A11 11 0 0 1 150 186Z" fill="${f}"/><path d="M150 186A11 11 0 0 1 172 186Z" fill="${f}"/><path d="M139 186V177M133 186L135 179M145 186L143 179M161 186V177M155 186L157 179M167 186L165 179" stroke="${l}" stroke-width="1.6" stroke-linecap="round"/>`;
    o+=`<g fill="#fff">`+[0,1,2,3,4,5,6].map(i=>{const a=Math.PI*(.15+i*.7/6);return `<circle cx="${(150-17*Math.cos(a)).toFixed(1)}" cy="${(158+9*Math.sin(a)).toFixed(1)}" r="2.6"/>`;}).join('')+`</g>`;
  }else{
    o+=`<path d="M121 166Q150 156 179 166L171 220Q150 226 129 220Z" fill="${f}"/>`;
    o+=`<path d="M132 163Q150 158 168 163Q160 176 150 172Q140 176 132 163Z" fill="${sk}"/>`;
    o+=`<path d="M129 211Q150 218 171 211L171 220Q150 227 129 220Z" fill="${l}"/><circle cx="150" cy="218" r="4" fill="${GOLD}"/>`;
  }
  // arms
  o+=`<path d="M120 172Q102 202 108 234M180 172Q198 194 204 214" stroke="${sk}" stroke-width="12" fill="none" stroke-linecap="round"/>`;
  if(!mer)o+=`<circle cx="121" cy="170" r="13" fill="${f}"/><circle cx="179" cy="170" r="13" fill="${f}"/><circle cx="117" cy="166" r="4.5" fill="${l}" opacity=".7"/><circle cx="175" cy="166" r="4.5" fill="${l}" opacity=".7"/>`;
  // head + face
  o+=`<circle cx="150" cy="110" r="38" fill="${sk}"/>`;
  o+=`<ellipse cx="136" cy="116" rx="4.6" ry="6.2" fill="#3a2340"/><ellipse cx="164" cy="116" rx="4.6" ry="6.2" fill="#3a2340"/><circle cx="137.6" cy="113.6" r="1.7" fill="#fff"/><circle cx="165.6" cy="113.6" r="1.7" fill="#fff"/>`;
  o+=`<path d="M130.5 111L128 108.5M169.5 111L172 108.5" stroke="#3a2340" stroke-width="1.8" stroke-linecap="round"/>`;
  o+=`<circle cx="126" cy="128" r="7" fill="#ff8fae" opacity=".45"/><circle cx="174" cy="128" r="7" fill="#ff8fae" opacity=".45"/>`;
  o+=`<path d="M140 131Q150 141 160 131" stroke="#c0506e" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  o+=HAIRFRONT[s.hair](h);
  o+=CROWN[s.crown]();
  o+=MAGIC[s.magic]();
  o+=`<circle cx="108" cy="236" r="7.5" fill="${sk}"/><circle cx="205" cy="215" r="7.5" fill="${sk}"/>`;
  o+=FRIEND[s.friend]();
  o+=SPARKLE[s.sparkle]();
  return o+'</svg>';
}

function bump(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);}
function drawStage(){pic.innerHTML=render(look,'st');store.set('look',look);}
function drawTabs(){
  tabsEl.innerHTML=TABS.map(t=>`<button class="tab" role="tab" aria-selected="${t.id===curTab}" aria-label="${t.id}" data-t="${t.id}">${ICON[t.id]}</button>`).join('');

function drawPanel(){
  const t=TABS.find(t=>t.id===curTab);
  itemsEl.innerHTML=t.items.map((v,i)=>{const s=Object.assign({},look,{[t.id]:v});
    return `<button class="item${look[t.id]===v?' on':''}" data-i="${i}" aria-label="${t.id} ${v}" aria-pressed="${look[t.id]===v}">${render(s,'th'+t.id+i,t.crop)}</button>`;}).join('');
  if(t.colors){
    const [key,pal]=t.colors;
    colorsEl.innerHTML=Object.keys(pal).map((c,i)=>`<button class="dot${look[key]===c?' on':''}" data-c="${c}" data-i="${i}" aria-label="${c}" style="background:${SWATCH[c]||pal[c]}"></button>`).join('');
    colorsEl.hidden=false;
  }else{colorsEl.innerHTML='';colorsEl.hidden=true;}
}
tabsEl.addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;curTab=b.dataset.t;sfx.tab();drawTabs();drawPanel();itemsEl.scrollLeft=0;});

const pick=a=>a[Math.floor(Math.random()*a.length)];
$('surpriseBtn').addEventListener('click',()=>{
  TABS.forEach(t=>{let v=pick(t.items);if(t.id==='crown'||t.id==='magic'||t.id==='friend'){ if(v==='none')v=t.items[0]; }look[t.id]=v;});
  look.dressColor=pick(Object.keys(DRESSC));look.hairColor=pick(Object.keys(HAIRC));

/* ================= SPARKLE WAND ================= */
const Wand=(function(){
  const cv=$('wandCanvas'),ctx=cv.getContext('2d');
  let W=0,H=0,dpr=1,on=false,raf=0,bg=null,night=store.get('wandNight',true),brush='rainbow';
  let segs=[],parts=[],pts={},hue=0,lastNote=0,noteIdx=0,touched=false;
  const bgStars=[];
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    bg=document.createElement('canvas');bg.width=cv.width;bg.height=cv.height;
    const b=bg.getContext('2d');b.scale(dpr,dpr);
    const g=b.createLinearGradient(0,0,0,H);
    if(night){g.addColorStop(0,'#241a5c');g.addColorStop(.6,'#4b2f8f');g.addColorStop(1,'#8a55c2');}
    else{g.addColorStop(0,'#ffd6ee');g.addColorStop(.55,'#fff0f8');g.addColorStop(1,'#d9efff');}
    b.fillStyle=g;b.fillRect(0,0,W,H);
    const r=rng(11);
    if(night){
      for(let i=0;i<Math.round(W*H/2600);i++){b.globalAlpha=r()*.6+.25;b.fillStyle='#fff';b.beginPath();b.arc(r()*W,r()*H*.85,r()*1.4+.4,0,7);b.fill();}
      b.globalAlpha=.16;b.fillStyle='#fff4c4';b.beginPath();b.arc(W*.82,H*.14,46,0,7);b.fill();
      b.globalAlpha=1;b.beginPath();b.arc(W*.82,H*.14,28,0,7);b.fill();
    }else{
      b.globalAlpha=.9;b.fillStyle='#fff';
      [[.2,.16,1],[.78,.1,.8],[.6,.32,.7]].forEach(([x,y,s])=>{s*=Math.min(W,600)/400;[[-22,0,14],[0,-10,19],[22,0,14]].forEach(([dx,dy,rr])=>{b.beginPath();b.arc(W*x+dx*s,H*y+dy*s,rr*s,0,7);b.fill();});b.beginPath();b.ellipse(W*x,H*y+6*s,36*s,11*s,0,0,7);b.fill();});
      b.globalAlpha=.5;const cols=['#ff8f8f','#ffbb6e','#ffe070','#94e08f','#7fc8ff','#b796ff'];
      cols.forEach((c,i)=>{b.strokeStyle=c;b.lineWidth=14;b.beginPath();b.arc(W/2,H*1.05,Math.max(W,H)*.62-i*14,Math.PI,2*Math.PI);b.stroke();});
    }
    b.globalAlpha=1;
    bgStars.length=0;for(let i=0;i<14;i++)bgStars.push({x:r()*W,y:r()*H*.8,s:r()*5+4,p:r()*6});
  }
  /* shapes */
  function spark(x,y,s){ctx.beginPath();ctx.moveTo(x,y-s);ctx.quadraticCurveTo(x,y,x+s,y);ctx.quadraticCurveTo(x,y,x,y+s);ctx.quadraticCurveTo(x,y,x-s,y);ctx.quadraticCurveTo(x,y,x,y-s);ctx.fill();}
  function star(x,y,s){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?s*.45:s;ctx.lineTo(x+rr*Math.cos(a),y+rr*Math.sin(a));}ctx.closePath();ctx.fill();}

  }
  const BR={
    rainbow:{trail:()=>`hsl(${hue%360},100%,72%)`,kinds:['spark','spark','star'],col:()=>`hsl(${(hue+Math.random()*60)%360},100%,78%)`},
    gold:{trail:()=>'#ffd34d',kinds:['star','spark','star'],col:()=>Math.random()<.5?'#fff3a8':'#ffd34d'},
    hearts:{trail:()=>'#ff7fb8',kinds:['heart','heart','spark'],col:()=>['#ff6fae','#ffa6d2','#ff4f86','#d9a8ff'][Math.floor(Math.random()*4)]},
    unicorn:{trail:()=>['#ffb3d9','#c5a8ff','#9fe8f0','#ffe070'][Math.floor(hue/40)%4],kinds:['uni','spark','star','heart'],col:()=>['#ffb3d9','#c5a8ff','#9fe8f0','#fff3a8'][Math.floor(Math.random()*4)]}
  };
  function spawn(x,y,n,burst){

  function chime(y){const now=performance.now();if(now-lastNote<110)return;lastNote=now;
    const i=Math.max(0,Math.min(P.length-1,Math.floor((1-y/H)*P.length)));Snd.bell(P[i],0,.06);}

  function move(e){
    const p=pts[e.pointerId];if(!p)return;const x=e.offsetX,y=e.offsetY,dx=x-p.x,dy=y-p.y,d=Math.hypot(dx,dy);if(d<2)return;

  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('pointerleave',up);
  function frame(now){
    if(!on)return;raf=requestAnimationFrame(frame);
    ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(bg,0,0);ctx.setTransform(dpr,0,0,dpr,0,0);

  $('wandbar').addEventListener('click',e=>{const b=e.target.closest('[data-b]');if(!b)return;brush=b.dataset.b;

  drawSkyBtn();
  return{
    start(){on=true;resize();cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);},
    stop(){on=false;cancelAnimationFrame(raf);segs=[];parts=[];pts={};}
  };
})();

    if(!tdrag.ghost){
      if(Math.hypot(e.clientX-tdrag.sx,e.clientY-tdrag.sy)<10)return;
      const g=document.createElement('div');g.className='ghost';g.innerHTML=STK_SVG[tdrag.k];
      const r=scene.getBoundingClientRect();g.style.width=(STK[tdrag.k].w/300*r.width)+'px';document.body.appendChild(g);tdrag.ghost=g;
      sfx.tab();
    }
    tdrag.ghost.style.left=e.clientX+'px';tdrag.ghost.style.top=e.clientY+'px';
  });
  function add(k,x,y){
    if(placed.length>=40)placed.shift();
    const p={k,x,y,z:++zTop};placed.push(p);draw();save();
    const el=layer.lastElementChild;if(el)bump(el,'drop');
  }
  function endTray(e){
    if(!tdrag||e.pointerId!==tdrag.id)return;const t=tdrag;tdrag=null;
    if(t.ghost){t.ghost.remove();const s=toScene(e.clientX,e.clientY);if(s.inside&&e.type==='pointerup'){add(t.k,s.x,s.y);bloop();}return;}
    if(e.type!=='pointerup')return;
    // a tap: drop it somewhere in the water or sky, a little random
    const sea=STK[t.k].tall||['fish','octo','shell','star','pearl','coral','bubbles'].includes(t.k);
    add(t.k,60+Math.random()*180,sea?260+Math.random()*90:60+Math.random()*120);sfx.tap(t.i);
  }
  tray.addEventListener('pointerup',endTray);tray.addEventListener('pointercancel',endTray);
  $('castleClear').addEventListener('click',()=>{if(!placed.length)return;placed=[];draw();save();sfx.home();});
  return{start(){draw();}};
})();

/* ---------------- routing ---------------- */
const ROUTES={'dress-up':'dressup','wand':'wand','castle':'castle'};
const READY={'dress-up':true,'wand':true,'castle':true};
function show(){
  const r=location.hash.slice(1);const id=ROUTES[r];
  document.querySelectorAll('.view').forEach(v=>v.hidden=true);
  Wand.stop();
  if(id&&READY[r]){$(id).hidden=false;$('homeBtn').hidden=false;
    if(id==='dressup'){drawStage();drawTabs();drawPanel();}
    if(id==='wand')Wand.start();
    if(id==='castle')Castle.start();}
  else{$('home').hidden=false;$('homeBtn').hidden=true;}
}
document.querySelectorAll('.tile').forEach(t=>{
  const r=t.dataset.go;if(READY[r])t.querySelector('[data-soon]')?.remove();else t.classList.add('soon');
  t.addEventListener('click',()=>{
    if(!READY[r]){sfx.soon();bump(t,'wiggle');return;}
    sfx.open();location.hash=r;
  });
});
$('homeBtn').addEventListener('click',()=>{sfx.home();history.replaceState(null,'',location.pathname+location.search);show();});
window.addEventListener('hashchange',show);
document.addEventListener('pointerdown',()=>Snd.ensure(),{once:true});

$('tileDress').innerHTML=render(Object.assign({},DEF,{place:'rainbow'}),'tA','82 24 136 102');
drawMute();show();
})();
</script>
