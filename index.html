<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Violet's Sparkle Palace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
  :root { color-scheme: light; --plum:#5a2a78; --pink:#ff4fa3; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; text-align: center;
    font-family: 'Fredoka', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
    color: var(--plum);
    background:
      radial-gradient(circle at 20% 15%, #ffd9ee 0, transparent 45%),
      radial-gradient(circle at 85% 30%, #dff1ff 0, transparent 45%),
      radial-gradient(circle at 50% 95%, #fff1c9 0, transparent 50%),
      #fbefff;
    padding: 24px max(16px, env(safe-area-inset-left)) 24px max(16px, env(safe-area-inset-right));
    box-sizing: border-box; overflow: hidden;
  }
  h1 { font-size: clamp(2.2rem, 9vw, 4rem); line-height: 1.05; margin: 0.4em 0 0.2em; font-weight: 700; }
  h1 span { color: var(--pink); display: block; }
  p { font-size: clamp(1.1rem, 4vw, 1.5rem); margin: 0; opacity: .85; }
  .sky { position: fixed; inset: 0; pointer-events: none; }
  .tw { animation: tw 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes tw { 0%,100% { transform: scale(.55); opacity: .5 } 50% { transform: scale(1); opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .tw { animation: none } }
</style>
</head>
<body>
  <svg class="sky" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <g fill="#ffcf4a">
      <path class="tw" style="animation-delay:0s" d="M12 14Q12 18 16 18Q12 18 12 22Q12 18 8 18Q12 18 12 14Z"/>
      <path class="tw" style="animation-delay:.6s" d="M86 20Q86 23 89 23Q86 23 86 26Q86 23 83 23Q86 23 86 20Z"/>
      <path class="tw" style="animation-delay:1.1s" d="M18 78Q18 81 21 81Q18 81 18 84Q18 81 15 81Q18 81 18 78Z"/>
      <path class="tw" style="animation-delay:.3s" d="M80 74Q80 78 84 78Q80 78 80 82Q80 78 76 78Q80 78 80 74Z"/>
      <path class="tw" style="animation-delay:1.6s" d="M50 8Q50 10 52 10Q50 10 50 12Q50 10 48 10Q50 10 50 8Z"/>
    </g>
  </svg>
  <main>
    <svg width="150" height="120" viewBox="0 0 150 120" aria-hidden="true">
      <g fill="none" stroke-width="9" stroke-linecap="round">
        <path d="M15 110 A60 60 0 0 1 135 110" stroke="#ff9a9a"/>
        <path d="M26 110 A49 49 0 0 1 124 110" stroke="#ffd27a"/>
        <path d="M37 110 A38 38 0 0 1 113 110" stroke="#9be39b"/>
        <path d="M48 110 A27 27 0 0 1 102 110" stroke="#94d3ff"/>
        <path d="M59 110 A16 16 0 0 1 91 110" stroke="#c7a8ff"/>
      </g>
      <path d="M52 44 L56 18 L66 32 L75 12 L84 32 L94 18 L98 44Z" fill="#ffd34d" stroke="#e5a91f" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="75" cy="37" r="4.5" fill="#ff5fa8"/>
    </svg>
    <h1>Violet's <span>Sparkle Palace</span></h1>
    <p>Coming soon</p>
  </main>
</body>
</html>
